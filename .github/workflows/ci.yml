name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: {POSTGRES_USER: todo, POSTGRES_PASSWORD: todo, POSTGRES_DB: todo_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://todo:todo@localhost:5432/todo_test
      MIGRATE_DATABASE_URL: postgresql+asyncpg://todo:todo@localhost:5432/todo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
