[project]
name = "todo-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic[email]==2.14.1",
  "pydantic-settings==2.16.1",
  "structlog==26.1.0",
  "prometheus-fastapi-instrumentator==8.1.0",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pwdlib[argon2]==0.3.1",
  "pyjwt==2.15.1",
  "redis==8.1.0",
  "celery[redis]==5.6.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "mypy==2.4.0",
  "asgi-lifespan==2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
